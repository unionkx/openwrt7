name: Build ax6000_7v

on: 
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 7 20 * * 1
env:
  CONFIG_FILE: ax6000v.config
  CUSTOM_SH: custom7.sh

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/microsoft
        sudo -E apt-get update
        sudo -E apt-get -y install bzip2 g++ gawk gcc git glibc-source libncurses-dev make
        sudo -E apt-get -y autoremove
        sudo -E apt-get autoclean

    - name: Clone source code
      run: |
        git clone -b main --single-branch https://github.com/openwrt/openwrt.git openwrt

    - name: Update Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configuration Customization
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $CUSTOM_SH
        cd openwrt
        $GITHUB_WORKSPACE/$CUSTOM_SH

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make download

    - name: Build firmware
      run: |
        cd openwrt
        make -j1

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: ax6000_7v
        path: openwrt/bin

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 5
        keep_minimum_runs: 2
