name: Build ax6000_7v

on: 
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 7 20 * * 1
env:
  CONFIG_FILE: ax6000v.config
  CUSTOM_SH: custom7.sh

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:

    - name: Checkout
      uses: actions/checkout@main

    - name: Init environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /opt/microsoft
        sudo -E apt-get update
        sudo -E apt-get -y install bzip2 g++ gawk gcc git glibc-source libncurses-dev make
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get autoclean

    - name: Clone source code
      run: |
        git clone -b openwrt-25.12 --single-branch https://github.com/openwrt/openwrt.git openwrt

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Config custom
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $CUSTOM_SH
        cd openwrt
        $GITHUB_WORKSPACE/$CUSTOM_SH
        make defconfig

    - name: Download package
      run: |
        cd openwrt
        make download -j2

    - name: Build firmware
      run: |
        cd openwrt
        make -j2

    - name: Upload
      uses: actions/upload-artifact@main
      with:
        name: ax6000_7v
        path: openwrt/bin

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 2
        keep_minimum_runs: 2
